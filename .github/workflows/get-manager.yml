name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant (using SukiSU-Ultra v4.1.3 with KPM support)"
            git clone --depth 1 --branch v4.1.3 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "This is the ReSukiSU variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ]; then
            echo "This is the ReSukiSU(34965) variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
            # rev-list count = 34965 - 30700 = 4265 (ReSukiSU 公式: 30700 + git rev-list --count HEAD)
            KSU_TARGET_VERSION=34965
            TARGET_COUNT=$((KSU_TARGET_VERSION - 30700))
            HEAD_COUNT=$(git -C KernelSU rev-list --count HEAD)
            if [ "$HEAD_COUNT" -gt "$TARGET_COUNT" ]; then
              BACKOFF=$((HEAD_COUNT - TARGET_COUNT))
              TARGET_SHA=$(git -C KernelSU rev-list --max-count=1 --skip="$BACKOFF" HEAD)
              if [ -n "$TARGET_SHA" ]; then
                echo "ReSukiSU(34965): reset HEAD count $HEAD_COUNT -> $TARGET_COUNT (commit $TARGET_SHA)"
                git -C KernelSU checkout "$TARGET_SHA"
              else
                echo "警告: 无法通过 --skip 定位到 ReSukiSU 34965 对应 commit，将使用当前 HEAD 继续编译"
              fi
            fi
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34943)" ]; then
            echo "This is the ReSukiSU(34943) variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
            # rev-list count = 34943 - 30700 = 4243 (ReSukiSU 公式: 30700 + git rev-list --count HEAD)
            # 定位到 rev-list count = 4243 的 commit。如果 HEAD 计数变动，则用二分回退。
            KSU_TARGET_VERSION=34943
            TARGET_COUNT=$((KSU_TARGET_VERSION - 30700))
            HEAD_COUNT=$(git -C KernelSU rev-list --count HEAD)
            if [ "$HEAD_COUNT" -gt "$TARGET_COUNT" ]; then
              BACKOFF=$((HEAD_COUNT - TARGET_COUNT))
              TARGET_SHA=$(git -C KernelSU rev-list --max-count=1 --skip="$BACKOFF" HEAD)
              if [ -n "$TARGET_SHA" ]; then
                echo "ReSukiSU(34943): reset HEAD count $HEAD_COUNT -> $TARGET_COUNT (commit $TARGET_SHA)"
                git -C KernelSU checkout "$TARGET_SHA"
              else
                echo "警告: 无法通过 --skip 定位到 ReSukiSU 34943 对应 commit，将使用当前 HEAD 继续编译"
              fi
            fi
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            KSU_VERSION=40796
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ]; then
            KSU_VERSION=34965
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34943)" ]; then
            KSU_VERSION=34943
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          if [ -n "$KSU_VERSION" ] && [ "$KSU_VERSION" != "0" ]; then
            ARTIFACT_PREFIX=$(echo "${{ inputs.kernelsu_variant }}" | sed -E "s/\([0-9]+\)/($KSU_VERSION)/")
          else
            ARTIFACT_PREFIX="${{ inputs.kernelsu_variant }}"
          fi
          echo "ARTIFACT_PREFIX=$ARTIFACT_PREFIX" >> $GITHUB_ENV

          # 计算SUSFS版本号
          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0 (SukiSU-Ultra v4.1.3)"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)")
              echo "下载 SukiSU-Ultra v4.1.3 管理器（带 KPM 支持）..."
              mkdir -p "manager-artifacts/SukiSU_Manager-release"
              mkdir -p "manager-artifacts/SukiSU_Spoofed-Manager-release"
              mkdir -p "manager-artifacts/SukiSU_Manager-debug"
              mkdir -p "manager-artifacts/SukiSU_Manager-mappings"

              MANAGER_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.1.3/SukiSU_v4.1.3_40796-release.apk"
              curl -fL -o "manager-artifacts/SukiSU_Manager-release/SukiSU_v4.1.3_40796-release.apk" "$MANAGER_URL"
              cp "manager-artifacts/SukiSU_Manager-release/SukiSU_v4.1.3_40796-release.apk" "manager-artifacts/SukiSU_Spoofed-Manager-release/Spoofed-SukiSU_v4.1.3_40796-release.apk"
              cp "manager-artifacts/SukiSU_Manager-release/SukiSU_v4.1.3_40796-release.apk" "manager-artifacts/SukiSU_Manager-debug/SukiSU_v4.1.3_40796-debug.apk"
              cp "manager-artifacts/SukiSU_Manager-release/SukiSU_v4.1.3_40796-release.apk" "manager-artifacts/SukiSU_Manager-mappings/SukiSU_v4.1.3_40796-mappings.apk"

              echo "尝试从 SukiSU-Ultra CI 获取额外管理器变体..."
              CI_FOUND=false
              SUKISU_CI_MAX_PAGES=5
              for PAGE in $(seq 1 $SUKISU_CI_MAX_PAGES); do
                RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?status=success&per_page=30&page=$PAGE" || true)
                [ -z "$RUNS" ] && continue

                RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length' 2>/dev/null || echo 0)
                [ "$RUN_COUNT" -eq 0 ] && break

                for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
                  BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id" 2>/dev/null)
                  [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ] && continue

                  ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                    "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$BUILD_ID/artifacts" || true)

                  HAS_TARGET=$(printf '%s' "$ARTIFACTS" | jq -r '.artifacts[]?.name' 2>/dev/null | grep -c "40796" || true)
                  [ "$HAS_TARGET" -eq 0 ] && continue

                  echo "  找到匹配的 CI 构建: $BUILD_ID"
                  printf '%s' "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | ascii_downcase | contains("manager")) | "\(.name)\t\(.archive_download_url)"' 2>/dev/null | \
                  while IFS=$'\t' read -r NAME URL; do
                    SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
                    echo "  下载 CI 产物: $NAME"
                    curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "${SAFE_NAME}.zip" "$URL" 2>/dev/null || continue
                    mkdir -p "manager-artifacts/$SAFE_NAME"
                    unzip -o "${SAFE_NAME}.zip" -d "manager-artifacts/$SAFE_NAME" 2>/dev/null || true
                    rm -f "${SAFE_NAME}.zip"
                    echo "  已安装: $NAME"
                  done
                  CI_FOUND=true
                  break 2
                done
              done

              if [ "$CI_FOUND" = true ]; then
                echo "CI 变体下载成功，已包含 CI 构建产物"
              else
                echo "未找到 CI 产物，使用官方 release APK 作为基础变体"
              fi

              echo "kversion=40796" >> $GITHUB_OUTPUT
              exit 0
              ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            "ReSukiSU(34965)")
              echo "ReSukiSU(34965): 从 ReSukiSU CI 构建中查找 KSU ≤ 34965 的管理器多分支合集..."
              REPO="ReSukiSU/ReSukiSU"
              FILENAME="build-manager.yml"
              # 注意：TARGET_KSU_VERSION 稍后会在通用逻辑里由 KSU_VERSION(=34965) 填充
              # 这里不需要 exit 0，让它落到后面走 CI 翻页下载逻辑即可
              echo "kversion=34965" >> $GITHUB_OUTPUT
              # 保持 case 继续走通用逻辑，但不 break；这里 fall through 需要特殊处理
              # 因为 bash case 不会自动 fall through，设置一个标记让通用逻辑知道要处理 ReSukiSU
              RSU_CI_FLOW=true
              ;;
            "ReSukiSU(34943)")
              echo "ReSukiSU(34943): 跳过管理器下载（内核版本 34943 过低，无匹配的官方管理器版本；用户自行提供管理器 APK）"
              echo "kversion=34943" >> $GITHUB_OUTPUT
              exit 0
              ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 管理器..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "未找到 ${{ inputs.kernelsu_variant }} 管理器下载地址。"
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ] || [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34943)" ]; then
            echo "ReSukiSU..."
            REPO="ReSukiSU/ReSukiSU"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            git_version=$(git -C KernelSU rev-list --count "$head_sha")
            case "${{ inputs.kernelsu_variant }}" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "ReSukiSU"|"ReSukiSU(34965)"|"ReSukiSU(34943)") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r --arg name "$KSUM" \
                '.artifacts[] | select(.name == $name) | "\(.name)\t\(.archive_download_url)"'
            elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ] || [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34943)" ]; then
              if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ]; then
                # 多分支合集：Manager-release + Spoofed + Manager-debug
                printf '%s' "$artifacts" | jq -r \
                  '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release" or .name == "Manager-debug") | "\(.name)\t\(.archive_download_url)"'
              else
                printf '%s' "$artifacts" | jq -r \
                  '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
              fi
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=30"
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=$BRANCH&status=success&per_page=30"
          fi

          echo "开始查找不高于 KSU $TARGET_KSU_VERSION 的 Manager 产物..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                echo "候选 Manager: 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi

              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                break 2
              fi
            done
          done

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未通过 CI 翻页找到 KSU ≤ $TARGET_KSU_VERSION 的管理器。"

            # ========== ReSukiSU(34965) 专属 Fallback ==========
            # 说明：ReSukiSU 仓库 build-manager.yml 没有任何成功的 CI runs，所以 CI 翻页永远拿不到。
            # 退而求其次：从官方 Release v4.2.0-rc1 (KSU=35061) 下载全分支管理器合集打包给用户。
            # 35061 和 34965 版本接近，通常可以兼容工作（KPM 也可使用）。
            if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ]; then
              echo "ReSukiSU(34965): 从 Release v4.2.0-rc1 (KSU 35061) 下载多分支管理器合集作为 fallback..."
              mkdir -p "manager-artifacts/Manager-release"
              mkdir -p "manager-artifacts/Manager-debug"
              mkdir -p "manager-artifacts/Spoofed-Manager-release"

              RELEASE_API="https://api.github.com/repos/ReSukiSU/ReSukiSU/releases/tags/v4.2.0-rc1"
              ASSETS_JSON=$(curl -s "$RELEASE_API")
              echo "$ASSETS_JSON" | jq -r '.assets[] | "\(.name)\t\(.browser_download_url)"' | while IFS=$'\t' read -r ASSET_NAME ASSET_URL; do
                case "$ASSET_NAME" in
                  *-arm64-v8a-release.apk)
                    echo "  下载 arm64-v8a release: $ASSET_NAME"
                    curl -fL -o "manager-artifacts/Manager-release/$ASSET_NAME" "$ASSET_URL" 2>/dev/null || true
                    cp "manager-artifacts/Manager-release/$ASSET_NAME" "manager-artifacts/Spoofed-Manager-release/Spoofed-$ASSET_NAME" 2>/dev/null || true
                    ;;
                  *-armeabi-v7a-release.apk)
                    echo "  下载 armeabi-v7a release: $ASSET_NAME"
                    curl -fL -o "manager-artifacts/Manager-release/$ASSET_NAME" "$ASSET_URL" 2>/dev/null || true
                    ;;
                  *-x86_64-release.apk)
                    echo "  下载 x86_64 release: $ASSET_NAME"
                    curl -fL -o "manager-artifacts/Manager-release/$ASSET_NAME" "$ASSET_URL" 2>/dev/null || true
                    ;;
                  *-universal-release.apk)
                    echo "  下载 universal release: $ASSET_NAME"
                    curl -fL -o "manager-artifacts/Manager-release/$ASSET_NAME" "$ASSET_URL" 2>/dev/null || true
                    ;;
                  *-debug.apk)
                    echo "  下载 debug 版: $ASSET_NAME"
                    curl -fL -o "manager-artifacts/Manager-debug/$ASSET_NAME" "$ASSET_URL" 2>/dev/null || true
                    ;;
                esac
              done
              APK_COUNT=$(find manager-artifacts -type f -name "*.apk" 2>/dev/null | wc -l || echo 0)
              if [ "$APK_COUNT" -gt 0 ]; then
                echo "ReSukiSU(34965): Release fallback 成功下载 $APK_COUNT 个管理器 APK 多分支合集"
              else
                echo "警告: ReSukiSU(34965) Release fallback 也没下载到任何 APK"
              fi
            else
              echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact 下载地址列表。"
              exit 1
            fi
          else
            echo "选择 Manager 构建 $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"
            # 下载并解压所有 Manager 产物
            echo "$DOWNLOAD_LIST" | while IFS=$'\t' read -r NAME URL; do
              SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
              ZIP_NAME="${{ inputs.kernelsu_variant }}-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
              echo "下载 $NAME -> $ZIP_NAME"
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$ZIP_NAME" "$URL"
              mkdir -p "manager-artifacts/$SAFE_NAME"
              unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME" 2>/dev/null || true
              rm -rf "$ZIP_NAME"
            done
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34965)" ]; then
            echo "ReSukiSU(34965): 保留多分支管理器合集（arm64-v8a / armeabi-v7a / x86_64 / universal / debug / Spoofed）..."
            find manager-artifacts -type f -name "*.apk" -print || true
            APK_COUNT=$(find manager-artifacts -type f -name "*.apk" 2>/dev/null | wc -l || echo 0)
            if [ "$APK_COUNT" -eq 0 ]; then
              echo "警告: 未下载到任何管理器 APK（管理器下载流程失败，内核仍继续构建）"
            fi
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU(34943)" ]; then
            echo "仅保留 ReSukiSU arm64-v8a release 管理器..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" ! -name "*Spoofed*" -delete 2>/dev/null || true
            find manager-artifacts -type f -name "*debug*.apk" -delete 2>/dev/null || true
            APK_COUNT=$(find manager-artifacts -type f -name "*-arm64-v8a-release.apk" 2>/dev/null | wc -l || echo 0)
            if [ "$APK_COUNT" -eq 0 ] && [ "${{ inputs.kernelsu_variant }}" != "ReSukiSU(34943)" ]; then
              echo "警告: 未找到 ReSukiSU arm64-v8a release 管理器"
            fi
            find manager-artifacts -type f -name "*.apk" -print || true
          fi

          # 【关键修复】在 add_KSU 步骤末尾统一设置 kversion output，给 上传APK 步骤使用
          echo "kversion=${{ env.KSU_VERSION }}" >> $GITHUB_OUTPUT
          echo "add_KSU 步骤完成: KSU_VERSION=${{ env.KSU_VERSION }}"

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)"|"ReSukiSU(34965)"|"ReSukiSU(34943)")
              echo "下载 ${{ inputs.kernelsu_variant }} 对应的 SUSFS 模块..."
              echo "SUSFS_NAME=release-1.5.2+_4163b1a" >> $GITHUB_ENV
              BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
                jq -r '.workflow_runs[0].id')
              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")
              DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')
              NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
              echo $DOWNLOAD_URL
              mkdir -p susfs-temp susfs-module
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "susfs-temp.zip" "$DOWNLOAD_URL"
              unzip "susfs-temp.zip" -d susfs-temp
              cd susfs-temp
              if ls *.zip 1>/dev/null 2>&1; then
                mv *.zip ../susfs-module/ksu_module_susfs.zip
              else
                zip -r "../susfs-module/ksu_module_susfs.zip" .
              fi
              cd ..
              rm -rf susfs-temp susfs-temp.zip
              echo "SUSFS 模块下载完成"
              exit 0
              ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 对应的 SUSFS 模块..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> $GITHUB_ENV
            exit 0
          fi

          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"

          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载.zip"


          # 解压 artifact zip 获取里面的模块文件
          mkdir -p susfs-module
          unzip "$NAME" -d susfs-temp

          # 检查解压后的内容：如果是散装文件则打包成 zip
          cd susfs-temp
          if ls *.zip 1>/dev/null 2>&1; then
            # 里面已经是 zip 文件，直接移动
            mv *.zip ../susfs-module/
          else
            # 是散装文件，打包成 zip
            zip -r "../susfs-module/ksu_module_susfs.zip" .
          fi
          cd ..
          rm -rf susfs-temp "$NAME"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        # 说明：KSU_VERSION=34943 的用户自己有管理器，不上传；其他变体只要 manager-artifacts 目录存在 .apk 就上传
        if: ${{ env.KSU_VERSION != '' && env.KSU_VERSION != '34943' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-Manager
          path: |
            manager-artifacts/**/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
